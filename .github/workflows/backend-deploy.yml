name: Deploy API to Staging

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - '.github/workflows/api-deploy-staging.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: blacksmith-2vcpu-ubuntu-2404
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build workspace packages (if needed)
        run: pnpm --filter=@guess-logo/game-core build
      
      # Optional: keep these for quality
      # - name: Run type check
      #   run: pnpm --filter=@guess-logo/api check-types
      
      # - name: Run linter
      #   run: pnpm --filter=@guess-logo/api lint
      #   continue-on-error: true
      
      # If your project requires a build step that outputs deployable files,
      # keep this and adjust workingDirectory below to the output dir.
      # Otherwise, remove it — wrangler deploy handles TS/minification.
      # - name: Build API (if using build output)
      #   run: pnpm --filter=@guess-logo/api build
      
      - name: Deploy to Cloudflare Workers Staging
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy --minify --env production
      
      - name: Deployment summary
        if: success()
        run: |
          echo "## ✅ Staging Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "API deployed to: https://api.playgrid.mohdalaa.com" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
      
      - name: Deployment failed
        if: failure()
        run: |
          echo "## ❌ Staging Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs above." >> $GITHUB_STEP_SUMMARY
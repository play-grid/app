  api-checks:
    name: api - Lint & Type Check
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run ESLint
        run: pnpm turbo run lint:fix --filter @playgrid/api
      
      - name: Run TypeScript type check
        run: pnpm turbo run check-types --filter @playgrid/api
      
      - name: Run unit tests
        run: pnpm turbo run test:all --filter @playgrid/api
        continue-on-error: true
      
      - name: Create check summary
        if: always()
        run: |
          echo "## api Checks" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Linting completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Type checking completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Unit tests completed" >> $GITHUB_STEP_SUMMARY

  all-checks-passed:
    name: All Checks Passed
    needs: [detect-changes, frontend-checks, api-checks]
    if: always()
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.frontend-checks.result }}" == "failure" ]] || \
             [[ "${{ needs.api-checks.result }}" == "failure" ]]; then
            echo "## ❌ Some checks failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "## ✅ All checks passed" >> $GITHUB_STEP_SUMMARY
            echo "Ready to merge!" >> $GITHUB_STEP_SUMMARY
          fi
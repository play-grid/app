name: PR Checks

permissions:
  pull-requests: read
  contents: read

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'apps/frontend/**'
      - 'apps/api/**'
      - '.github/workflows/pr-checks.yml'
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'apps/frontend/**'
            api:
              - 'apps/api/**'

  frontend-checks:
    name: Frontend - Lint & Type Check
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run ESLint and format
        run: pnpm turbo run lint:fix --filter @playgrid/frontend
      
      - name: Run TypeScript type check
        run: pnpm turbo run check-types --filter @playgrid/frontend
      
      - name: Create check summary
        if: always()
        run: |
          echo "## Frontend Checks" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Linting completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Type checking completed" >> $GITHUB_STEP_SUMMARY

